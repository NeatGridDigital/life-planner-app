  --paper:#12161F;--card:#1B212E;--ink:#EAEFFB;--muted:#A6AFC2;--line:#2A3347;--soft:#242936;--input:#252F47;
  --lav:#739DFF;--lav-deep:#89ACFF;--lav-tint:#263350;--peach:#FFD699;--peach-deep:#FFD699;--peach-tint:#3B3020;
  --mint:#6FDDBE;--mint-deep:#8FE6CD;--mint-tint:#173A31;--pink:#F7DDB7;--sky:#89ACFF;
  --bad:#FF8A80;--bad-tint:#3D2224;--ok:#8FE6CD;--ok-tint:#173A31;--warn:#FFD479;--warn-tint:#3A3018;
  --btn:#739DFF;--btn-ink:#12161F;
  --hero1:#2D3F69;--hero2:#364A79;--hero3:#7B6749;--hero-ink:#F1F5FF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -16px rgba(0,0,0,.85);color-scheme:dark}}
:root[data-look=dark]{
  --paper:#12161F;--card:#1B212E;--ink:#EAEFFB;--muted:#A6AFC2;--line:#2A3347;--soft:#242936;--input:#252F47;
  --lav:#739DFF;--lav-deep:#89ACFF;--lav-tint:#263350;--peach:#FFD699;--peach-deep:#FFD699;--peach-tint:#3B3020;
  --mint:#6FDDBE;--mint-deep:#8FE6CD;--mint-tint:#173A31;--pink:#F7DDB7;--sky:#89ACFF;
  --bad:#FF8A80;--bad-tint:#3D2224;--ok:#8FE6CD;--ok-tint:#173A31;--warn:#FFD479;--warn-tint:#3A3018;
  --btn:#739DFF;--btn-ink:#12161F;
  --hero1:#2D3F69;--hero2:#364A79;--hero3:#7B6749;--hero-ink:#F1F5FF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -16px rgba(0,0,0,.85);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:0 16px calc(108px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.top h1{margin:0;font:600 30px/1.1 var(--serif);letter-spacing:-.3px}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.brand svg{width:26px;height:26px}
.banner{background:var(--peach-tint);color:var(--peach-deep);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 12px}
h2{font:600 22px/1.2 var(--serif);margin:26px 0 10px;letter-spacing:-.2px}
h2 .sub{font:400 14px var(--sans);color:var(--muted);margin-left:6px}
h3{font:600 16px/1.3 var(--sans);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.neg{color:var(--bad)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
@media (min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.wide2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hrow h2{margin-bottom:10px}
.linkb{border:0;background:none;color:var(--lav-deep);font-weight:600;padding:4px 2px;font-size:14px}
.screen.enter{animation:enter .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:20px 18px 18px;color:var(--hero-ink);
  background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 52%,var(--hero3) 100%)}
.hero .deco{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.blob{animation:drift 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.blob.b2{animation-duration:18s;animation-delay:-4s}.blob.b3{animation-duration:22s;animation-delay:-9s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,-10px) scale(1.08)}100%{transform:translate(-10px,8px) scale(.96)}}
.spark{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.95;transform:scale(1.1)}}
.hero .hi{font:600 28px/1.15 var(--serif);letter-spacing:-.3px}
.hero .dt{opacity:.9;font-size:15px;margin-top:2px}
.hero .word{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:13px;backdrop-filter:blur(4px)}
.hero .word b{font:600 15px var(--serif);font-style:italic}
.rings{display:flex;gap:10px;margin-top:16px;justify-content:space-between;max-width:420px}
.rg{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:12px;opacity:.95}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.ring .c b{font:600 20px var(--serif)}
.ring .c span{font-size:11px;opacity:.8}
.ring.big .c b{font-size:34px}

/* lists */
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;width:100%;
  background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li.nochk{grid-template-columns:1fr auto}
.li:last-child{border-bottom:0}
button.li:active,.li .main:active{background:var(--soft)}
.li .main{border:0;background:none;padding:0;text-align:left;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .m{font-size:13px;color:var(--muted)}
.li .r{text-align:right;font-size:14px}
.li.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.anim .list .li{animation:enter .35s ease-out both}
.anim .list .li:nth-child(2){animation-delay:.03s}.anim .list .li:nth-child(3){animation-delay:.06s}.anim .list .li:nth-child(4){animation-delay:.09s}
.anim .list .li:nth-child(5){animation-delay:.12s}.anim .list .li:nth-child(n+6){animation-delay:.15s}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--lav);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none;transition:background .2s,transform .15s}
.chk svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--lav)}
.chk.on svg{opacity:1}
:root[data-look=dark] .chk svg{stroke:#12161F}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .chk svg{stroke:#12161F}}
.chk.pop{animation:popc .45s cubic-bezier(.3,1.6,.5,1)}
.chk.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:tickd .35s ease-out .1s forwards}
@keyframes popc{40%{transform:scale(1.25)}}
@keyframes tickd{to{stroke-dashoffset:0}}
.chk:active{transform:scale(.9)}

/* pills and chips */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.wait{background:var(--soft);color:var(--muted)}
.pill.lav{background:var(--lav-tint);color:var(--lav-deep)}
.area{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.area i{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 0 4px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;color:var(--ink)}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.seg button .n{opacity:.7;margin-left:4px;font-size:12px}

/* habits today */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hb{display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:16px;padding:12px;box-shadow:var(--shadow);text-align:left;min-height:62px;transition:background .25s,transform .15s}
.hb .nm{flex:1;font-size:14px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.hb .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px;font-weight:600}
.hb.on{background:var(--lav-tint)}
.hb:active{transform:scale(.97)}
.flame{width:14px;height:14px;flex:none}
.flame path{fill:var(--peach)}
.hb.on .flame{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.15,1.08)}}

/* check-in */
.faces{display:flex;gap:6px;justify-content:space-between}
.face{flex:1;border:0;background:var(--soft);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);transition:transform .2s,background .2s}
.face svg{width:34px;height:34px}
.face.on{background:var(--peach-tint);color:var(--peach-deep);transform:translateY(-3px)}
.face.on svg{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{40%{transform:scale(1.2)}}
.ci{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci>span{font-size:14px;color:var(--muted)}
.dots5{display:flex;gap:8px}
.dots5 button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;transition:background .2s,border-color .2s,transform .15s}
.dots5 button.on{background:var(--lav);border-color:var(--lav)}
.dots5 button:active{transform:scale(.88)}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:24px;height:32px;border:0;background:none;padding:0}
.glass svg{width:24px;height:32px;display:block}
.glass .wl{transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.glass.on .wl{transform:scaleY(1)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;padding:0}
.stepper b{font:600 20px var(--serif);min-width:64px;text-align:center}

/* events */
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.ev:last-child{border-bottom:0}
.ev .dd{text-align:center;border-radius:12px;background:var(--lav-tint);color:var(--lav-deep);padding:4px 0;line-height:1.1}
.ev .dd b{display:block;font:600 20px var(--serif)}
.ev .dd span{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.ev .dd.Birthday{background:#FEF4E6;color:#A67731}
.ev .dd.Bill{background:var(--peach-tint);color:var(--peach-deep)}
.ev .dd.Trip,.ev .dd.Holiday{background:var(--mint-tint);color:var(--mint-deep)}
:root[data-look=dark] .ev .dd.Birthday{background:#3E3322;color:#F7DDB7}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .ev .dd.Birthday{background:#3E3322;color:#F7DDB7}}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.calhead h2{margin:0;min-width:0}
.navb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;padding:0;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cell{position:relative;border:0;background:var(--card);border-radius:12px;min-height:54px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);overflow:hidden}
.cell.out{background:transparent;box-shadow:none;color:var(--muted);opacity:.45}
.cell .n{font-size:14px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cell.today .n{background:var(--btn);color:var(--btn-ink)}
.cell.sel{outline:2px solid var(--lav);outline-offset:-2px}
.cell .ds{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cell .ds i{width:6px;height:6px;border-radius:50%;background:var(--lav)}
.cell .ds i.Birthday{background:#E7B66C}.cell .ds i.Bill{background:var(--peach)}.cell .ds i.Trip,.cell .ds i.Holiday{background:var(--mint)}.cell .ds i.Appointment{background:#6D8EF0}
.cell .ds i.task{background:transparent;border:1.5px solid var(--peach-deep);border-radius:2px}
.cell .txt{display:none}
@media (min-width:760px){.cell{min-height:96px;align-items:stretch}.cell .n{align-self:flex-start}.cell .ds{display:none}
  .cell .txt{display:block;font-size:11px;line-height:1.3;text-align:left;width:100%}
  .cell .txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin-bottom:2px;background:var(--lav-tint);color:var(--lav-deep)}
  .cell .txt div.task{background:var(--peach-tint);color:var(--peach-deep)}
  .cell .txt div.more{background:none;color:var(--muted)}}
.anim .cal .cell{animation:fadeup .4s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}

/* goals */
.vision{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;padding:18px;background:linear-gradient(135deg,var(--lav-tint),var(--peach-tint));display:flex;gap:16px;align-items:center}
.vision .w{font:italic 600 34px/1 var(--serif);color:var(--lav-deep)}
.vision .v{font:400 17px/1.35 var(--serif);margin-top:6px}
.vision .lab{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.vision .grow{flex:1;min-width:0}
.gcards{display:grid;gap:12px}
@media (min-width:720px){.gcards{grid-template-columns:1fr 1fr}}
.gcard{display:flex;gap:14px;align-items:center;background:var(--card);border:0;border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .15s}
.gcard:active{transform:scale(.985)}
.gcard .grow{flex:1;min-width:0}
.gcard .gt{font:600 18px/1.25 var(--serif);margin:2px 0}
.gcard .why{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.gcard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.anim .gcards>*{animation:enter .4s ease-out both}
.anim .gcards>*:nth-child(2){animation-delay:.05s}.anim .gcards>*:nth-child(3){animation-delay:.1s}.anim .gcards>*:nth-child(4){animation-delay:.15s}.anim .gcards>*:nth-child(n+5){animation-delay:.2s}

/* habits */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.week .corner{display:none}
.week .hn{grid-column:1/-1;padding:10px 0 2px!important}
@media (min-width:560px){.week{grid-template-columns:minmax(0,1fr) repeat(7,42px);gap:8px 4px}.week .corner{display:block}.week .hn{grid-column:auto;padding:6px 0!important}}
.week .wh{text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.week .wh b{display:block;font-size:13px;color:var(--ink)}
.week .wh.today b{color:var(--lav-deep)}
.week .hn{border:0;background:none;padding:6px 0;text-align:left;min-width:0}
.week .hn .t{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .hn .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.hd{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;justify-self:center;transition:background .2s,border-color .2s}
.hd.on{background:var(--lav);border-color:var(--lav)}
.hd.today{border-color:var(--lav)}
.hd[disabled]{opacity:.35;cursor:default}
.hd.pop{animation:popc .45s cubic-bezier(.3,1.6,.5,1)}
.heat{display:grid;grid-template-columns:30px repeat(31,minmax(0,1fr));gap:2px;align-items:center}
.heat span{font-size:10px;color:var(--muted)}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--soft)}
.heat i.x{background:transparent}
.anim .heat i{animation:fadein .5s ease-out both}
@keyframes fadein{from{opacity:0;transform:scale(.4)}}
.vbars{display:flex;align-items:stretch;gap:6px;height:150px;padding-top:6px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vb .col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vb i{display:block;width:100%;max-width:16px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--lav),var(--peach));transform-origin:50% 100%}
.vb i.off{background:var(--soft)}
.anim .vb i{animation:riseb .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes riseb{from{transform:scaleY(0)}to{transform:none}}
.vb span{font-size:11px;color:var(--muted)}

/* charts */
svg.chart{display:block;width:100%;overflow:visible}
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.3,.6,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim .areaf{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;transform:rotate(-90deg);flex:none}
.donut .seg2{transition:stroke-dasharray 1.1s cubic-bezier(.2,.7,.2,1)}
.donut .lg{flex:1;min-width:150px}
.donut .lg div{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.donut .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.donut .lg b{margin-left:auto;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--lav),var(--peach));transform-origin:0 50%}
.bar i.over{background:var(--bad)}
.bar i.mint{background:var(--mint)}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.big{font:600 44px/1 var(--serif);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font:600 24px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted);display:block;line-height:1.3}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:600}

/* jars */
.jars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.jars{grid-template-columns:repeat(4,1fr)}}
.jar{background:var(--card);border:0;border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.jar svg{width:84px;height:104px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}

    var pt = function (i, v) { var ang = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(ang) * R0 * v / 10, cy + Math.sin(ang) * R0 * v / 10]; };
    [2, 4, 6, 8, 10].forEach(function (v) { h += '<polygon points="' + S.areas.map(function (a, i) { return pt(i, v).map(function (z) { return z.toFixed(1); }).join(","); }).join(" ") + '" fill="none" stroke="var(--line)"/>'; });

      return '<polygon class="wpoly ' + cls + '" points="' + pts + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5" stroke-linejoin="round"/>'; };

  function toggleTask(id) {

      var g = S.goals.filter(function (x) { return x.goal === t.goal; })[0]; if (g) { var rg = R.goals[S.goals.indexOf(g)]; if (rg.progress >= 1 && g.target == null) { view.party = true; toast("Goal reached: " + g.goal); } } }

  document.addEventListener("click", function (ev) {

    else if (a === "more") { view.tab = "more"; view.more = v || null; view.shown = 40; view.anim = true; closeSheet(); render(); window.scrollTo(0, 0); }
    else if (a === "quick") quick();

    else if (a === "load-sample") { if (!isEmpty() && !S.asOf && !confirm("Load the sample? It replaces what is in the app now. Save a backup first if you want to keep it.")) return;
      S = clone(SAMPLE); save(); view.tab = "today"; view.cy = null; view.mm = null; view.wm = null; view.anim = true; closeSheet(); render(); window.scrollTo(0, 0); toast("Sample loaded"); }
    else if (a === "clear-all") { if (!confirm(S.asOf ? "Clear the sample and start your own year?" : "Delete everything in the app? This can't be undone.")) return;
      var keepLook = S.settings.look; S = blank(); S.settings.look = keepLook; save(); view.tab = "today"; view.cy = null; view.anim = true; render(); window.scrollTo(0, 0); setupSheet(); }
    else if (a === "task-tick") { toggleTask(id); if (b.dataset.in === "goal") { var tg = byId("tasks", id); calc(); goalSheet(S.goals.filter(function (g) { return g.goal === tg.goal; })[0].id); rerender(); } else softRender(); }

    else if (a === "htick") { var d = b.dataset.d; S.ticks[id] = S.ticks[id] || {}; var on = !S.ticks[id][d]; if (on) S.ticks[id][d] = 1; else delete S.ticks[id][d]; save();

      softRender(); }
    else if (a === "habit") habitSheet(id);
    else if (a === "new-habit") habitSheet(null);
    else if (a === "del-habit") { if (confirm("Delete this habit and its ticks?")) { drop("habits", id); delete S.ticks[id]; save(); closeSheet(); rerender(); } }
    else if (a === "hsel") { view.hsel = v; view.anim = true; rerender(); }
